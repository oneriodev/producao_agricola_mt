# Serviços (containers) que o projeto usa
services:
  db:                                  # nome do serviço
    image: postgres:16                 # imagem oficial do PostgreSQL, versão 16
    container_name: producao_agricola_db
    environment:                       # configuram o Postgres na 1ª execução
      POSTGRES_USER: ${POSTGRES_USER}          # valores lidos do .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"        # porta_do_pc : porta_do_container
    volumes:
      - pgdata:/var/lib/postgresql/data  # dados persistem no volume
    restart: unless-stopped

volumes:
  pgdata:
